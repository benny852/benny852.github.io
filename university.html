<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Projects | Ben Harrison</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/site-nav.css">
  <link rel="stylesheet" href="css/university.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
</head>
<body class="university-page">

  <header>
    <h1 class="page-title">UNIVERSITY</h1>
  </header>

  <section class="uni-hub" aria-label="University project areas">
    <div class="uni-hub-grid">
      <a href="#university-overview" class="uni-hub-card uni-hub-card--wide uni-hub-card--overview" aria-label="Overview">
        <img src="videos/university/overviewboys.png" alt="">
        <span class="uni-hub-label">OVERVIEW</span>
      </a>
      <a href="robobooth.html" class="uni-hub-card uni-hub-card--robobooth" aria-label="Robo-Booth">
        <img src="videos/university/rs2/robot_samir.png" alt="">
        <span class="uni-hub-label">ROBO-BOOTH</span>
      </a>
      <a href="university-donkey-kong.html" class="uni-hub-card uni-hub-card--donkey" aria-label="Teaching an agent to play Donkey Kong">
        <img src="videos/university/donkeykong/donkeykong-animation.gif" alt="">
        <span class="uni-hub-label">TEACHING AN AGENT TO PLAY DONKEY KONG</span>
      </a>
    </div>
  </section>

  <main id="university-overview">
    <div class="video-section hero-intro-section">
      <div class="hero-intro-text hero-intro-text--left">
        FINAL<br>YEAR<br>STUDENT
      </div>
      <div class="hero-intro-video">
        <video class="uni-video" src="videos/university/watch-rework.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="hero-intro-text hero-intro-text--right">
        <div class="hero-intro-major">
          MECHANICAL<br>AND<br>MECHATRONICS
        </div>
        <span class="hero-intro-wam">75+ WAM</span>
      </div>
    </div>

    <div class="video-section">
      <video class="uni-video" src="videos/university/2.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-section">
      <video class="uni-video" src="videos/university/3.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-section">
      <video class="uni-video" src="videos/university/4.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-section">
      <video class="uni-video" src="videos/university/5.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-section">
      <video class="uni-video" src="videos/university/6.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-section">
      <video class="uni-video" src="videos/university/7.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-section">
      <video class="uni-video" src="videos/university/8.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-section">
      <video class="uni-video" src="videos/university/9.mp4" autoplay loop muted playsinline></video>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var videos = document.querySelectorAll('.uni-video');
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          entry.target.classList.toggle('active', entry.isIntersecting);
        });
      }, { threshold: 0.2 });
      videos.forEach(function (video) {
        observer.observe(video);
      });
    });
  </script>
  <script src="js/site-nav.js"></script>
</body>
</html>
